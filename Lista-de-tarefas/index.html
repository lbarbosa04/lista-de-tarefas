<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lista de Tarefas</title>
</head>
<body>
    
 <h1>Lista de Tarefas</h1>

 
    <div class="linha-inputs">
        <label for="tarefasMes">Adicionar Tarefa:</label>
        <input type="text" name="tarefasMes" id="tarefasMes" placeholder="Adicione uma Tarefa...">

        <label for="vencimentoTarefa">Vencimento:</label>
        <input type="date" id="vencimentoTarefa" min="2026-01-01" max="2099-12-31">
        <input type="button" value="Adicionar" onclick="adicionarSazonais()">
    </div>


    <div id="listaTarefas"></div>

<script src="script.js"></script>   
</body>
</html>
