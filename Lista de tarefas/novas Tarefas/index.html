<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lista de Tarefas</title>
</head>
<body>
    
  <h1>TAREFAS SAZONAIS</h1>
 <div class="form-container">
    <div class="linha-inputs">
        <label for="dataTarefa">Data:</label>
        <input type="date" id="dataTarefa">

        <label for="vencimentoTarefa">Vencimento:</label>
        <input type="date" id="vencimentoTarefa">
    </div>

    <div class="linha-inputs">
        <label for="tarefasMes">Adicionar Tarefa:</label>
        <input type="text" name="tarefasMes" id="tarefasMes" placeholder="Adicione uma Tarefa...">
        <input type="button" value="Adicionar" onclick="adicionarSazonais()">
    </div>
</div>

    <div id="listaTarefas"></div>

<script src="script.js"></script>   
</body>
</html>
